configuration:
  SOURCE_MQTT_HOST:
    name: SOURCE_MQTT_HOST
    description: Hostname or IP of the source MQTT broker (for Growatt)
  SOURCE_MQTT_PORT:
    name: SOURCE_MQTT_PORT
    description: Port number of the source MQTT broker
  SOURCE_MQTT_TLS:
    name: SOURCE_MQTT_TLS
    description: Set to true to enable TLS without certificate validation
  SOURCE_MQTT_USER:
    name: SOURCE_MQTT_USER
    description: Username for the source MQTT broker (if authentication is required)
  SOURCE_MQTT_PASS:
    name: SOURCE_MQTT_PASS
    description: Password for the source MQTT broker
  TARGET_MQTT_HOST:
    name: TARGET_MQTT_HOST
    description: Hostname or IP of the target MQTT broker (for Home Assistant)
  TARGET_MQTT_PORT:
    name: TARGET_MQTT_PORT
    description: Port number of the target MQTT broker
  TARGET_MQTT_TLS:
    name: TARGET_MQTT_TLS
    description: Set to true to enable TLS without certificate validation
  TARGET_MQTT_USER:
    name: TARGET_MQTT_USER
    description: Username for the target MQTT broker (if authentication is required)
  TARGET_MQTT_PASS:
    name: TARGET_MQTT_PASS
    description: Password for the target MQTT broker
  MQTT_CLIENT_SUFFIX:
    name: MQTT_CLIENT_SUFFIX
    description: Optional suffix for MQTT client IDs. Only needed when multiple GroBro instances share the same broker.
  HA_BASE_TOPIC:
    name: HA_BASE_TOPIC
    description: Base MQTT topic used for Home Assistant auto-discovery and sensor states
  GROWATT_CLOUD:
    name: GROWATT_CLOUD
    description: Set to true to forward messages to and from the Growatt server. Default is false.
  GROWATT_CLOUD_CONFIG_FILTER:
    name: GROWATT_CLOUD_CONFIG_FILTER
    description: Blocks forwarded configuration messages to protect the datalogger from remote setting changes initiated by the Growatt Cloud.
  LOG_LEVEL:
    name: LOG_LEVEL
    description: Logging level ERROR, DEBUG, or INFO. Default is ERROR.
  DUMP_MESSAGES:
    name: DUMP_MESSAGES
    description: Dumps every received raw message into DUMP_DIR for later analysis.
  DUMP_DIR:
    name: DUMP_DIR
    description: Directory used for raw message dumps. Default is /share/GroBro/dump.
  REGISTER_DEBUG:
    name: REGISTER_DEBUG
    description: Enables passive register logging. No additional read requests or register writes are sent to devices.
  REGISTER_DEBUG_DIR:
    name: REGISTER_DEBUG_DIR
    description: Directory used for register dumps. Default is /share/GroBro/register_debug.
  REGISTER_DEBUG_MAX_REGISTER:
    name: REGISTER_DEBUG_MAX_REGISTER
    description: Highest register address retained from actually received Modbus blocks. Default is 65535.
  REGISTER_DEBUG_CHANGES_ONLY:
    name: REGISTER_DEBUG_CHANGES_ONLY
    description: When enabled, every value is logged on first observation and then only when it changes.
  PUBLISH_SENSORS_RETAINED:
    name: PUBLISH_SENSORS_RETAINED
    description: Publish sensor states with the MQTT retain flag. Default is false.
  MAX_SLOTS:
    name: MAX_SLOTS
    description: Number of battery scheduling slots shown in Home Assistant (NOAH max 9). Default is 1.
  MAX_BAT:
    name: MAX_BAT
    description: Number of battery modules shown in Home Assistant. "auto" prefers the reported battery count and falls back to detected serial fragments only when needed.
  DEVICE_TIMEOUT:
    name: DEVICE_TIMEOUT
    description: Timeout in seconds before a device is considered unavailable. 0 disables the timeout; 300 seconds or more is recommended.
  AVAILABILITY_SENSOR:
    name: AVAILABILITY_SENSOR
    description: When enabled, an additional Online binary sensor is exposed. The normal device/entity availability topic remains active as well.
  FILTER_DATA_GLITCHES:
    name: FILTER_DATA_GLITCHES
    description: Suppress decreases in total_increasing sensors such as energy counters. Default is false.
  TZ:
    name: Timezone
    description: Local timezone used for correct timestamps in logs and system events.
  KEEP_BATTERY_POSITION:
    name: KEEP_BATTERY_POSITION
    description: Track NOAH battery serial numbers across slot changes and log a warning when a module moves to a different position.
