configuration:
  SOURCE_MQTT_HOST:
    name: Source MQTT host
    description: Hostname or IP address of the MQTT broker used by Growatt.
  SOURCE_MQTT_PORT:
    name: Source MQTT port
    description: Port of the MQTT broker used by Growatt.
  SOURCE_MQTT_TLS:
    name: Source MQTT TLS
    description: Use TLS for the Growatt MQTT connection.
  SOURCE_MQTT_USER:
    name: Source MQTT username
    description: Username for the Growatt MQTT broker, if required.
  SOURCE_MQTT_PASS:
    name: Source MQTT password
    description: Password for the Growatt MQTT broker, if required.
  TARGET_MQTT_HOST:
    name: Home Assistant MQTT host
    description: Hostname or IP address of the MQTT broker used by Home Assistant.
  TARGET_MQTT_PORT:
    name: Home Assistant MQTT port
    description: Port of the MQTT broker used by Home Assistant.
  TARGET_MQTT_TLS:
    name: Home Assistant MQTT TLS
    description: Use TLS for the Home Assistant MQTT connection.
  TARGET_MQTT_USER:
    name: Home Assistant MQTT username
    description: Username for the Home Assistant MQTT broker, if required.
  TARGET_MQTT_PASS:
    name: Home Assistant MQTT password
    description: Password for the Home Assistant MQTT broker, if required.
  MQTT_CLIENT_SUFFIX:
    name: MQTT client suffix
    description: Optional suffix for MQTT client IDs when multiple Better GroBro instances share one broker.
  HA_BASE_TOPIC:
    name: Home Assistant base topic
    description: MQTT base topic used for Home Assistant discovery and states.
  GROWATT_CLOUD:
    name: Growatt Cloud forwarding
    description: Forward messages to and from the Growatt Cloud.
  GROWATT_CLOUD_CONFIG_FILTER:
    name: Growatt Cloud configuration filter
    description: Block remotely initiated configuration messages from the Growatt Cloud.
  LOG_LEVEL:
    name: Log level
    description: Logging level used by Better GroBro.
  DUMP_MESSAGES:
    name: Save raw messages
    description: Save every received raw MQTT message for later analysis.
  DUMP_DIR:
    name: Raw message directory
    description: Directory used for raw message dumps.
  REGISTER_DEBUG:
    name: Register debug
    description: Enable passive register logging without additional device reads or writes.
  REGISTER_DEBUG_DIR:
    name: Register debug directory
    description: Directory used for register debug data.
  REGISTER_DEBUG_MAX_REGISTER:
    name: Maximum register
    description: Highest register address retained from received Modbus blocks.
  REGISTER_DEBUG_CHANGES_ONLY:
    name: Log changes only
    description: Log every value once, then only when it changes.
  MAX_SLOTS:
    name: Battery time slots
    description: Number of battery scheduling slots exposed in Home Assistant.
  MAX_BAT:
    name: Maximum batteries
    description: Maximum number of battery modules shown in Home Assistant. Auto uses the detected count.
  DEVICE_TIMEOUT:
    name: Device timeout
    description: Minimum timeout in seconds before entities become unavailable. Device reporting intervals are respected automatically.
  AVAILABILITY_SENSOR:
    name: Availability sensor
    description: Expose an additional Online binary sensor. Normal entity availability remains active regardless.
  FILTER_DATA_GLITCHES:
    name: Filter measurement glitches
    description: Suppress decreases in total_increasing sensors such as energy counters.
  TZ:
    name: Timezone
    description: Local timezone used for logs and system events.
  KEEP_BATTERY_POSITION:
    name: Stable battery positions
    description: Keep NOAH and NEXA battery modules on stable logical slots by serial number across re-enumeration and restarts.
