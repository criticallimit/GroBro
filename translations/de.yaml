configuration:
  SOURCE_MQTT_HOST:
    name: SOURCE_MQTT_HOST
    description: Hostname oder IP-Adresse des Quell-MQTT-Brokers (für Growatt)
  SOURCE_MQTT_PORT:
    name: SOURCE_MQTT_PORT
    description: Port-Nummer des Quell-MQTT-Brokers
  SOURCE_MQTT_TLS:
    name: SOURCE_MQTT_TLS
    description: Auf true setzen, um TLS ohne Zertifikatsvalidierung zu aktivieren
  SOURCE_MQTT_USER:
    name: SOURCE_MQTT_USER
    description: Benutzername für den Quell-MQTT-Broker (falls Authentifizierung erforderlich)
  SOURCE_MQTT_PASS:
    name: SOURCE_MQTT_PASS
    description: Passwort für den Quell-MQTT-Broker
  TARGET_MQTT_HOST:
    name: TARGET_MQTT_HOST
    description: Hostname oder IP-Adresse des Ziel-MQTT-Brokers (für Home Assistant)
  TARGET_MQTT_PORT:
    name: TARGET_MQTT_PORT
    description: Port-Nummer des Ziel-MQTT-Brokers
  TARGET_MQTT_TLS:
    name: TARGET_MQTT_TLS
    description: Auf true setzen, um TLS ohne Zertifikatsvalidierung zu aktivieren
  TARGET_MQTT_USER:
    name: TARGET_MQTT_USER
    description: Benutzername für den Ziel-MQTT-Broker (falls Authentifizierung erforderlich)
  TARGET_MQTT_PASS:
    name: TARGET_MQTT_PASS
    description: Passwort für den Ziel-MQTT-Broker
  MQTT_CLIENT_SUFFIX:
    name: MQTT_CLIENT_SUFFIX
    description: Optionales Suffix für die MQTT-Client-IDs. Nur nötig, wenn mehrere GroBro-Instanzen denselben Broker verwenden.
  HA_BASE_TOPIC:
    name: HA_BASE_TOPIC
    description: Basis-MQTT-Topic für Home Assistant Auto-Discovery und Sensor-Status
  GROWATT_CLOUD:
    name: GROWATT_CLOUD
    description: Auf true setzen, um Nachrichten zum und vom Growatt-Server weiterzuleiten. Standard ist false.
  GROWATT_CLOUD_CONFIG_FILTER:
    name: GROWATT_CLOUD_CONFIG_FILTER
    description: Verhindert die Weiterleitung von Konfigurationsnachrichten und schützt den Datenlogger vor ferninitiierten Einstellungsänderungen durch die Growatt Cloud.
  LOG_LEVEL:
    name: LOG_LEVEL
    description: Logging-Level ERROR, DEBUG oder INFO. Standard ist ERROR.
  DUMP_MESSAGES:
    name: DUMP_MESSAGES
    description: Speichert jede empfangene Roh-Nachricht in DUMP_DIR für eine spätere Analyse.
  DUMP_DIR:
    name: DUMP_DIR
    description: Verzeichnis für Roh-Nachrichten. Standard ist /share/GroBro/dump.
  REGISTER_DEBUG:
    name: REGISTER_DEBUG
    description: Aktiviert den passiven Register-Debugger. Es werden keine zusätzlichen Lese- oder Schreibbefehle an die Geräte gesendet.
  REGISTER_DEBUG_DIR:
    name: REGISTER_DEBUG_DIR
    description: Verzeichnis für den Register-Dump. Standard ist /share/GroBro/register_debug.
  REGISTER_DEBUG_MAX_REGISTER:
    name: REGISTER_DEBUG_MAX_REGISTER
    description: Höchste Registeradresse, die aus tatsächlich empfangenen Modbus-Blöcken protokolliert wird. Standard 65535.
  REGISTER_DEBUG_CHANGES_ONLY:
    name: REGISTER_DEBUG_CHANGES_ONLY
    description: Wenn aktiviert, wird jeder Wert beim ersten Auftreten und danach nur bei Änderungen protokolliert.
  PUBLISH_SENSORS_RETAINED:
    name: PUBLISH_SENSORS_RETAINED
    description: Wenn aktiviert, werden Sensorzustände mit MQTT retain veröffentlicht. Standard ist false.
  MAX_SLOTS:
    name: MAX_SLOTS
    description: Anzahl der Zeitfenster in Home Assistant für die Batterieplanung (NOAH max. 9). Standard ist 1.
  MAX_BAT:
    name: MAX_BAT
    description: Anzahl der Batteriemodule in Home Assistant. "auto" nutzt zuerst den gemeldeten Batterie-Zähler und fällt nur bei fehlenden Daten auf erkannte Seriennummern zurück.
  DEVICE_TIMEOUT:
    name: DEVICE_TIMEOUT
    description: Timeout in Sekunden, nach dem das Gerät als nicht verfügbar gilt. 0 deaktiviert den Timeout; empfohlen sind 300 Sekunden oder mehr.
  AVAILABILITY_SENSOR:
    name: AVAILABILITY_SENSOR
    description: Wenn aktiviert, wird zusätzlich ein Online-Binary-Sensor bereitgestellt. Das normale Availability-Topic der Geräte und Entitäten bleibt weiterhin aktiv.
  FILTER_DATA_GLITCHES:
    name: FILTER_DATA_GLITCHES
    description: Unterdrückt bei Aktivierung Rücksprünge in total_increasing-Sensoren wie Energiezählern. Standard ist deaktiviert.
  TZ:
    name: Zeitzone
    description: Lokale Zeitzone für korrekte Zeitstempel in Logs und Systemereignissen.
  KEEP_BATTERY_POSITION:
    name: KEEP_BATTERY_POSITION
    description: Überwacht die Seriennummern der NOAH-Batterien auf Positionswechsel und protokolliert eine Warnung, wenn ein Modul den Steckplatz wechselt.
