configuration:
  SOURCE_MQTT_HOST:
    name: Quell-MQTT-Host
    description: Hostname oder IP-Adresse des von Growatt verwendeten MQTT-Brokers.
  SOURCE_MQTT_PORT:
    name: Quell-MQTT-Port
    description: Port des von Growatt verwendeten MQTT-Brokers.
  SOURCE_MQTT_TLS:
    name: Quell-MQTT-TLS
    description: TLS für die Growatt-MQTT-Verbindung verwenden.
  SOURCE_MQTT_USER:
    name: Quell-MQTT-Benutzername
    description: Benutzername für den Growatt-MQTT-Broker, falls erforderlich.
  SOURCE_MQTT_PASS:
    name: Quell-MQTT-Passwort
    description: Passwort für den Growatt-MQTT-Broker, falls erforderlich.
  TARGET_MQTT_HOST:
    name: Home-Assistant-MQTT-Host
    description: Hostname oder IP-Adresse des von Home Assistant verwendeten MQTT-Brokers.
  TARGET_MQTT_PORT:
    name: Home-Assistant-MQTT-Port
    description: Port des von Home Assistant verwendeten MQTT-Brokers.
  TARGET_MQTT_TLS:
    name: Home-Assistant-MQTT-TLS
    description: TLS für die Home-Assistant-MQTT-Verbindung verwenden.
  TARGET_MQTT_USER:
    name: Home-Assistant-MQTT-Benutzername
    description: Benutzername für den Home-Assistant-MQTT-Broker, falls erforderlich.
  TARGET_MQTT_PASS:
    name: Home-Assistant-MQTT-Passwort
    description: Passwort für den Home-Assistant-MQTT-Broker, falls erforderlich.
  MQTT_CLIENT_SUFFIX:
    name: MQTT-Client-Suffix
    description: Optionales Suffix für MQTT-Client-IDs, wenn mehrere Better-GroBro-Instanzen denselben Broker verwenden.
  HA_BASE_TOPIC:
    name: Home-Assistant-Basis-Topic
    description: MQTT-Basis-Topic für Home-Assistant-Discovery und Zustände.
  GROWATT_CLOUD:
    name: Growatt-Cloud-Weiterleitung
    description: Nachrichten zur und von der Growatt Cloud weiterleiten.
  GROWATT_CLOUD_CONFIG_FILTER:
    name: Growatt-Cloud-Konfigurationsfilter
    description: Ferninitiierte Konfigurationsnachrichten aus der Growatt Cloud blockieren.
  LOG_LEVEL:
    name: Log-Level
    description: Von Better GroBro verwendetes Logging-Level.
  DUMP_MESSAGES:
    name: Roh-Nachrichten speichern
    description: Jede empfangene MQTT-Roh-Nachricht für spätere Analyse speichern.
  DUMP_DIR:
    name: Roh-Nachrichten-Verzeichnis
    description: Verzeichnis für Roh-Nachrichten.
  REGISTER_DEBUG:
    name: Register-Debug
    description: Passives Register-Logging ohne zusätzliche Lese- oder Schreibbefehle aktivieren.
  REGISTER_DEBUG_DIR:
    name: Register-Debug-Verzeichnis
    description: Verzeichnis für Register-Debug-Daten.
  REGISTER_DEBUG_MAX_REGISTER:
    name: Maximales Register
    description: Höchste Registeradresse, die aus empfangenen Modbus-Blöcken berücksichtigt wird.
  REGISTER_DEBUG_CHANGES_ONLY:
    name: Nur Änderungen protokollieren
    description: Jeden Wert einmal und danach nur bei Änderungen protokollieren.
  MAX_SLOTS:
    name: Batterie-Zeitfenster
    description: Anzahl der Batterie-Zeitfenster in Home Assistant.
  MAX_BAT:
    name: Maximale Batterieanzahl
    description: Maximale Anzahl der in Home Assistant angezeigten Batteriemodule. Automatisch verwendet die erkannte Anzahl.
  DEVICE_TIMEOUT:
    name: Geräte-Timeout
    description: Mindest-Timeout in Sekunden, bevor Entitäten unavailable werden. Geräte-Meldeintervalle werden automatisch berücksichtigt.
  AVAILABILITY_SENSOR:
    name: Availability-Sensor
    description: Zusätzlichen Online-Binary-Sensor anzeigen. Die normale Entity-Availability bleibt unabhängig davon aktiv.
  FILTER_DATA_GLITCHES:
    name: Messwertsprünge filtern
    description: Rücksprünge bei total_increasing-Sensoren wie Energiezählern unterdrücken.
  TZ:
    name: Zeitzone
    description: Lokale Zeitzone für Logs und Systemereignisse.
  KEEP_BATTERY_POSITION:
    name: Stabile Batteriepositionen
    description: NOAH- und NEXA-Batteriemodule anhand ihrer Seriennummer über Neunummerierung und Neustarts auf stabilen logischen Positionen halten.
