name: "Better GroBro"
description: "GroBro optimized for Home Assistant with improved NOAH/NEXA support, stable battery mapping and built-in configuration"
version: "3.1.52"
slug: "grobro_register_debug"
init: false
url: https://github.com/criticallimit/GroBro
ingress: true
hassio_api: true
homeassistant_api: true
ingress_port: 8099
panel_icon: mdi:battery-sync-outline
panel_title: Better GroBro
panel_admin: true
arch:
  - armhf
  - armv7
  - aarch64
  - amd64
  - i386

build_from:
  amd64: "ghcr.io/home-assistant/amd64-python"
  armhf: "ghcr.io/home-assistant/armhf-python"
  armv7: "ghcr.io/home-assistant/armv7-python"
  aarch64: "ghcr.io/home-assistant/aarch64-python"
  i386: "ghcr.io/home-assistant/i386-python"
map:
  - share:rw
options:
  SOURCE_MQTT_HOST: homeassistant.local
  SOURCE_MQTT_PORT: 7006
  SOURCE_MQTT_TLS: true
  SOURCE_MQTT_USER: ""
  SOURCE_MQTT_PASS: ""
  TARGET_MQTT_HOST: homeassistant.local
  TARGET_MQTT_PORT: 1883
  TARGET_MQTT_TLS: false
  TARGET_MQTT_USER: ""
  TARGET_MQTT_PASS: ""
  MQTT_CLIENT_SUFFIX: ""
  HA_BASE_TOPIC: "homeassistant"
  GROWATT_CLOUD: false
  GROWATT_CLOUD_CONFIG_FILTER: false
  LOG_LEVEL: ERROR
  DUMP_MESSAGES: false
  DUMP_DIR: "/share/GroBro/dump"
  REGISTER_DEBUG: false
  REGISTER_DEBUG_DIR: "/share/GroBro/register_debug"
  REGISTER_DEBUG_MAX_REGISTER: 65535
  REGISTER_DEBUG_CHANGES_ONLY: true
  DEVICE_TIMEOUT: 120
  MAX_SLOTS: 1
  MAX_BAT: "auto"
  AVAILABILITY_SENSOR: false
  TZ: ""
  KEEP_BATTERY_POSITION: false

schema:
  SOURCE_MQTT_HOST: str
  SOURCE_MQTT_PORT: int
  SOURCE_MQTT_TLS: bool
  SOURCE_MQTT_USER: str?
  SOURCE_MQTT_PASS: str?
  TARGET_MQTT_HOST: str
  TARGET_MQTT_PORT: int
  TARGET_MQTT_TLS: bool
  TARGET_MQTT_USER: "str?"
  TARGET_MQTT_PASS: "str?"
  MQTT_CLIENT_SUFFIX: "str?"
  HA_BASE_TOPIC: "str?"
  GROWATT_CLOUD: bool
  GROWATT_CLOUD_CONFIG_FILTER: bool
  LOG_LEVEL: list(INFO|ERROR|DEBUG)?
  DUMP_MESSAGES: bool
  DUMP_DIR: "str?"
  REGISTER_DEBUG: "bool?"
  REGISTER_DEBUG_DIR: "str?"
  REGISTER_DEBUG_MAX_REGISTER: "int?"
  REGISTER_DEBUG_CHANGES_ONLY: "bool?"
  DEVICE_TIMEOUT: "int?"
  MAX_SLOTS: "int?"
  MAX_BAT: "str?"
  AVAILABILITY_SENSOR: bool
  TZ: str
  KEEP_BATTERY_POSITION: bool
