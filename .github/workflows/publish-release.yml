name: Publish Version Release

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Read add-on version
        id: version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version: *"\([^"]*\)"/\1/p' config.yaml)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check release
        id: release_check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check release image
        id: image_check
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if docker buildx imagetools inspect "ghcr.io/criticallimit/grobro:$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore published release source for image recovery
        if: ${{ steps.release_check.outputs.exists == 'true' && steps.image_check.outputs.exists != 'true' }}
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ steps.version.outputs.tag }}

      - name: Build and publish release image
        if: ${{ steps.image_check.outputs.exists != 'true' || steps.release_check.outputs.exists != 'true' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/criticallimit/grobro:latest
            ghcr.io/criticallimit/grobro:${{ steps.version.outputs.tag }}
          provenance: false

      - name: Publish GitHub release
        if: ${{ steps.release_check.outputs.exists != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          gh release create "$TAG" \
            --target "$TARGET_SHA" \
            --title "Better GroBro $VERSION" \
            --notes-file CHANGELOG.md
