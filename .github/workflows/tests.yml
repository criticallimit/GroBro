name: CI

on:
  push:
    branches: [main, criticallimit, "criticallimit/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI enabled for the fork; keep this workflow as the release safety net.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check grobro/ tests/

      - name: Start MQTT broker
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mosquitto mosquitto-clients
          cat > /tmp/grobro-mosquitto.conf <<'EOF'
          listener 1883 127.0.0.1
          allow_anonymous true
          persistence false
          EOF
          cat > /tmp/grobro-target-mosquitto.conf <<'EOF'
          listener 1884 127.0.0.1
          allow_anonymous true
          persistence false
          EOF
          mosquitto -c /tmp/grobro-mosquitto.conf -d
          mosquitto -c /tmp/grobro-target-mosquitto.conf -d
          for attempt in {1..20}; do
            if mosquitto_pub -h 127.0.0.1 -p 1883 -t grobro/ci/health -m ready &&
               mosquitto_pub -h 127.0.0.1 -p 1884 -t grobro/ci/health -m ready; then
              exit 0
            fi
            sleep 0.25
          done
          echo "MQTT broker did not start" >&2
          exit 1

      - name: Run tests
        env:
          E2E_MQTT_HOST: 127.0.0.1
          E2E_MQTT_PORT: "1883"
          E2E_MQTT_TARGET_PORT: "1884"
        run: python -m pytest tests/ -v --cov=grobro --cov-report=term-missing --cov-report=xml
